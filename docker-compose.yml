services: 
  postgres: 
    image: postgres:15
    container_name: xepelin_postgres
    environment: 
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports: 
      - "5432:5432"
    volumes: 
      - postgres_data:/var/lib/postgresql/data
    
  redis: 
    image: redis:7
    container_name: xepelin_redis
    ports: 
      - "6379:6379"
    
volumes: 
  postgres_data:


